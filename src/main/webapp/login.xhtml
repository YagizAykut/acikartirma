<?xml version='1.0' encoding='UTF-8' ?>

<ui:composition template="/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Açık Artırma - Giriş Yap</ui:define>

    <ui:define name="content">
        <div class="auth-layout">
            <div class="login-card">
                <h2>Sisteme Giriş</h2>

                <h:form>
                    <h:messages globalOnly="false" styleClass="error-messages" />

                    <div class="form-group">
                        <h:outputLabel value="Kullanıcı Adı" />
                        <h:inputText value="#{userBean.loginUsername}" required="true"
                                     requiredMessage="Lütfen kullanıcı adınızı girin."
                                     styleClass="form-control" />
                    </div>

                    <div class="form-group">
                        <h:outputLabel value="Şifre" />
                        <h:inputSecret value="#{userBean.loginPassword}" required="true"
                                       requiredMessage="Lütfen şifrenizi girin."
                                       styleClass="form-control" />
                    </div>

                    <h:commandButton value="Giriş Yap" action="#{userBean.login}" styleClass="btn btn-primary-auth" />

                    <h:link value="Hesabın yok mu? Buradan kayıt ol" outcome="register" styleClass="register-link" />
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
