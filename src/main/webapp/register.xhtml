<?xml version='1.0' encoding='UTF-8' ?>

<ui:composition template="/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:html5="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Açık Artırma - Kayıt Ol</ui:define>

    <ui:define name="content">
        <div class="auth-layout">
            <div class="register-card">
                <h2>Yeni Hesap Oluştur</h2>

                <h:form>
                    <h:messages globalOnly="false" styleClass="error-messages" />

                    <div class="form-row">
                        <div class="form-group">
                            <h:outputLabel value="Adınız" />
                            <h:inputText value="#{userBean.newUser.firstName}" required="true"
                                         requiredMessage="Ad gereklidir." styleClass="form-control" />
                        </div>
                        <div class="form-group">
                            <h:outputLabel value="Soyadınız" />
                            <h:inputText value="#{userBean.newUser.lastName}" required="true"
                                         requiredMessage="Soyad gereklidir." styleClass="form-control" />
                        </div>
                    </div>

                    <div class="form-group">
                        <h:outputLabel value="Kullanıcı Adı" />
                        <h:inputText value="#{userBean.newUser.username}" required="true"
                                     requiredMessage="Kullanıcı adı gereklidir." styleClass="form-control" />
                    </div>

                    <div class="form-group">
                        <h:outputLabel value="E-posta Adresi" />
                        <h:inputText value="#{userBean.newUser.email}" required="true"
                                     requiredMessage="E-posta gereklidir." styleClass="form-control"
                                     html5:placeholder="ornek@mail.com" />
                    </div>

                    <div class="form-group">
                        <h:outputLabel value="Telefon Numarası" />
                        <h:inputText value="#{userBean.newUser.phoneNumber}" required="true"
                                     requiredMessage="Telefon gereklidir." styleClass="form-control"
                                     html5:placeholder="5555555555" />
                    </div>

                    <div class="form-group">
                        <h:outputLabel value="Şifre" />
                        <h:inputSecret value="#{userBean.newUser.password}" required="true"
                                       requiredMessage="Şifre gereklidir." styleClass="form-control" />
                    </div>

                    <h:commandButton value="Hemen Kayıt Ol" action="#{userBean.register}" styleClass="btn btn-primary-auth" />

                    <h:link value="Zaten hesabın var mı? Giriş Yap" outcome="login" styleClass="login-link" />
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
